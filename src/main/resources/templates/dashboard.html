<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230a0a0a'/%3E%3Ctext x='8' y='12' font-size='9' fill='white' text-anchor='middle'%3E%E5%94%AE%3C/text%3E%3C/svg%3E">
    <title>数据看板 · 售后通</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="/js/theme.js"></script>
    <style>
        .board { flex: 1; padding: 24px; overflow: auto; position: relative; }
        /* 加载层:CDN 脚本移至页底后,画面先渲染,此处提示数据加载进度 */
        #loading { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 14px;
                   align-items: center; justify-content: center; background: var(--wash); z-index: 5; }
        #loading .spin { width: 22px; height: 22px; border: 2px solid var(--line); border-top-color: var(--ink);
                         border-radius: 50%; animation: rot .8s linear infinite; }
        #loading .txt { font-size: 12px; letter-spacing: .2em; color: var(--muted); }
        #loading.done { display: none; }
        @keyframes rot { to { transform: rotate(360deg); } }
        .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
        .card-kpi { background: var(--paper); border: 1px solid var(--line); border-top: 3px solid var(--ink); padding: 18px 20px; }
        .card-kpi .label { font-size: 11px; letter-spacing: .18em; color: var(--dim); }
        .card-kpi .value { font-size: 30px; font-weight: 600; margin-top: 8px; }
        .card-kpi .value small { font-size: 14px; color: var(--muted); font-weight: 400; }
        .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .chart-box { background: var(--paper); border: 1px solid var(--line); padding: 16px; height: 320px; }
        .chart-box h3 { font-size: 11px; letter-spacing: .15em; color: var(--muted); font-weight: 500; margin-bottom: 6px; }
        .chart { width: 100%; height: 270px; }
        .chart-fallback { font-size: 14px; color: var(--dim); padding: 40px 0; text-align: center; }
        @media (max-width: 960px) {
            .cards { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 640px) {
            .board { padding: 16px 12px; }
            .charts { grid-template-columns: 1fr; }
            .card-kpi .value { font-size: 24px; }
        }
    </style>
</head>
<body>
<header class="topbar">
    <div class="brand">售后通<em>SHOUHOUTONG</em></div>
    <nav>
        <a href="/simulator">客户模拟器</a>
        <a href="/workbench">店主工作台</a>
        <a href="/approvals">审批中心</a>
        <a href="/audit">审计中心</a>
        <a href="/dashboard" class="active">数据看板</a>
        <a href="/settings">设置</a>
    </nav>
</header>

<div class="desk">
    <aside class="sidebar">
        <h2>经营指标</h2>
        <a href="/dashboard" class="active">今日概览</a>
    </aside>
    <main class="board">
        <div id="loading"><div class="spin"></div><div class="txt">数据加载中</div></div>
        <div class="cards">
            <div class="card-kpi"><div class="label">今日接待</div><div class="value" id="kpiConv">-</div></div>
            <div class="card-kpi"><div class="label">今日拦截</div><div class="value" id="kpiDeny">-</div></div>
            <div class="card-kpi"><div class="label">经审批退款金额</div><div class="value" id="kpiRefund">-</div></div>
            <div class="card-kpi"><div class="label">审批平均响应</div><div class="value" id="kpiAvg">-</div></div>
        </div>
        <div class="charts">
            <div class="chart-box">
                <h3>策略命中分布(今日)</h3>
                <div class="chart" id="chartRules"></div>
            </div>
            <div class="chart-box">
                <h3>近 7 天接待趋势</h3>
                <div class="chart" id="chartWeek"></div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>
    /* CDN 脚本置于页底:画面与加载提示先行渲染,不再白屏阻塞 */
    const loadingEl = document.getElementById('loading');
    function hideLoading() { loadingEl.classList.add('done'); }
    function showLoadingError() {
        loadingEl.innerHTML = '<div class="txt">数据加载失败,请刷新重试</div>';
        loadingEl.classList.remove('done');
    }

    /* 图表颜色实时读 CSS 变量:暗色主题下不再硬编码黑柱 */
    const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
    function hexToRgba(hex, alpha) {
        const m = hex.replace('#', '');
        const v = m.length === 3 ? m.split('').map(c => c + c).join('') : m;
        const n = parseInt(v, 16);
        return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${alpha})`;
    }
    const charts = {}; // 复用实例,避免 30s 轮询反复 init 造成泄漏

    function render(data) {
        document.getElementById('kpiConv').textContent = data.conversations;
        document.getElementById('kpiDeny').textContent = data.denies;
        document.getElementById('kpiRefund').innerHTML = '¥' + Number(data.refundAmount).toFixed(2)
            + ' <small>/ ' + data.approvedCount + ' 笔</small>';
        const secs = data.avgApprovalSeconds;
        document.getElementById('kpiAvg').innerHTML = secs < 60 ? secs + ' <small>秒</small>'
            : Math.round(secs / 60) + ' <small>分</small>';

        if (typeof echarts === 'undefined') {
            document.querySelectorAll('.chart').forEach(el => {
                el.innerHTML = '<div class="chart-fallback">图表组件加载失败(离线环境)</div>';
            });
            return;
        }

        const INK = cssVar('--ink'), MUTED = cssVar('--muted'), LINE = cssVar('--line'), WASH = cssVar('--wash');
        const axisStyle = {
            axisLine: {lineStyle: {color: LINE}},
            axisLabel: {color: MUTED, fontSize: 11},
            splitLine: {lineStyle: {color: WASH}}
        };

        const rulesEl = document.getElementById('chartRules');
        const rules = charts.rules || (charts.rules = echarts.init(rulesEl));
        rules.setOption({
            grid: {left: 8, right: 16, top: 10, bottom: 8, containLabel: true},
            xAxis: {type: 'value', ...axisStyle},
            yAxis: {type: 'category', data: (data.ruleHits || []).map(r => r.ruleKey), ...axisStyle},
            series: [{
                type: 'bar', barWidth: 14, itemStyle: {color: INK},
                label: {show: true, position: 'right', color: MUTED},
                data: (data.ruleHits || []).map(r => r.hits)
            }]
        });

        const weekEl = document.getElementById('chartWeek');
        const week = charts.week || (charts.week = echarts.init(weekEl));
        week.setOption({
            grid: {left: 8, right: 16, top: 20, bottom: 8, containLabel: true},
            xAxis: {type: 'category', data: (data.weekConversations || []).map(r => r.day), ...axisStyle},
            yAxis: {type: 'value', minInterval: 1, ...axisStyle},
            series: [{
                type: 'line', smooth: true, symbol: 'circle', symbolSize: 7,
                lineStyle: {color: INK},
                itemStyle: {color: INK, borderColor: cssVar('--paper'), borderWidth: 2},
                areaStyle: {color: hexToRgba(INK, 0.06)},
                data: (data.weekConversations || []).map(r => r.cnt)
            }]
        });
    }

    fetch('/api/stats/today').then(r => r.json()).then(d => { hideLoading(); render(d); })
        .catch(() => showLoadingError());
    setInterval(() => fetch('/api/stats/today').then(r => r.json()).then(render).catch(() => {}), 30000);
    window.addEventListener('resize', () => Object.values(charts).forEach(c => c.resize()));
</script>
</body>
</html>
